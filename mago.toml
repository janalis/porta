# Mago configuration — https://mago.carthage.software
#
# The formatter is tuned to the Symfony coding standard (the same conventions
# php-cs-fixer's @Symfony ruleset produces): single quotes, 4-space indent,
# next-line braces for classes/functions/methods, same-line braces for control
# structures and closures, no spaces around concatenation, a space after `fn`,
# `?Type` nullable hints, ordered imports and a blank line before `return`.
#
# php-cs-fixer never reflows code, so to match it the formatter is configured
# NOT to re-wrap: a wide print width plus "preserve breaking" keeps every line
# exactly where it is and only normalises spacing/braces/imports.

php-version = "8.4"

[source]
# `plugins` is here for the same reason `src` is: a plugin ships code, and code
# this project ships is formatted, linted and analysed. It was outside every
# gate while a plugin file could only WIRE; now that a plugin may own classes,
# leaving it out would make plugins/ the place to put code you did not want
# graded.
paths = ["src", "tests", "plugins"]
# …but a VENDOR directory inside one of them is not code this project ships.
# Excluding it HERE, at the source level, drops it from the formatter, the
# linter and the analyzer at once — the per-tool excludes below cannot do that
# (and the formatter has no exclude list of its own, so a vendored file would
# be REWRITTEN by `composer format`).
#
# Literal paths only: `plugins/*/vendor`, `plugins/*/vendor/**`, `**/vendor`
# and `**/vendor/**` were each measured against a real vendored file and none
# matched. So a bundled plugin that vendors adds its own line here, and
# tests/Unit/Plugin/Runtime/BundledPluginVendorTest fails until it does.
#
# The entry below is the third-party-plugin fixture, which ships composer's
# generated maps VERBATIM — `array(…)`, no strict_types — because their exact
# shape is what it exists to prove we can read.
#
# The last entry is not a fixture at all — it is where the plugin-install E2e
# tests really install, so its contents are whatever a test last cloned. It is
# gitignored for the same reason, and linting generated debris reports on code
# nobody wrote and nobody can fix.
excludes = [
    "tests/Support/fixtures/thirdparty/acme-vendored/vendor",
    "tests/Support/fixtures/thirdparty/acme-malformed/vendor",
    "tests/Support/fixtures/home/.porta/vendor",
    "tests/Support/fixtures/home/.porta/plugins/cloned",
    "tests/Support/fixtures/home/.porta/plugins/demo",
]
# Analyzed for type information but never reported on, so the analyzer knows the
# types of third-party classes (symfony/tui, PHPUnit, …) instead of treating
# everything from them as `mixed`.
includes = ["vendor"]

[analyzer]
# Static analysis targets production code. Tests drive widgets through dynamic,
# string-keyed lookups ($tui->getById('editor')->…) that a static analyzer cannot
# follow. (The quality gates themselves used to sit in tools/ and be excluded
# too; they are Symfony commands in src/Console/ now, analysed like everything
# else.)
#
# A plugin's tests are tests, so they are excluded too — one literal entry per
# plugin, because mago's excludes take paths and not globs (`plugins/*/tests`
# and `plugins/**/tests` were both tried and match nothing). A plugin that
# grows a tests/ directory adds its line here; forgetting shows up immediately
# as analyzer errors about test-only idioms.
#
# tests/Support is NOT excluded: the shared seams every test leans on are the
# test code most worth type-checking, and they carry none of the dynamic
# getById() idioms that justify excluding the suites. Its fixtures (broken
# on purpose) and the standalone mock-server scripts stay out.
excludes = ["tests/Unit", "tests/Integration", "tests/E2e", "tests/Support/fixtures", "tests/Support/slow-reading-lsp-server.php", "tests/Support/demanding-lsp-server.php", "tests/Support/incremental-lsp-server.php", "tests/Support/mock-lsp-server.php", "tests/Support/command-lsp-server.php", "tests/Support/mock-dap-adapter.php", "tests/Support/garbage-lsp-server.php", "tests/Support/chunked-lsp-server.php", "tests/Support/error-lsp-server.php", "tests/Support/lsp-stub.php", "tests/Support/logging-lsp-server.php", "tests/Support/sigterm-immune-lsp-server.php", "plugins/graph-viewer/tests", "plugins/image-viewer/tests", "plugins/todo/tests", "plugins/local-history/tests", "plugins/git/tests", "plugins/symfony-lsp/tests"]

[formatter]
# Never re-wrap: keep the author's line breaks, like php-cs-fixer does.
print-width = 200
preserve-breaking-argument-list = true
preserve-breaking-parameter-list = true
preserve-breaking-conditional-expression = true
preserve-breaking-attribute-list = true
preserve-breaking-member-access-chain = true

# Symfony-specific overrides of Mago's defaults:
space-around-concatenation-binary-operator = false      # $a.$b, not $a . $b
space-before-arrow-function-parameter-list-parenthesis = true  # fn ($x), not fn($x)
empty-line-before-return = true                         # blank line before a non-leading return

# The remaining Symfony conventions are already Mago's defaults, kept explicit
# here as documentation:
single-quote = true
tab-width = 4
use-tabs = false
trailing-comma = true
null-type-hint = "question"                             # ?Type
control-brace-style = "same_line"                       # if (...) {
closure-brace-style = "same_line"
function-brace-style = "next_line"
method-brace-style = "next_line"
classlike-brace-style = "always_next_line"
sort-uses = true

[linter]
# `composer lint` is a required gate. The paths below are EXCLUDED
# deliberately — no rule is disabled; everything runs at full strength.
# The mock LSP/DAP servers are standalone procedural scripts, not codebase
# code — they keep their script idioms (camelCase helpers, `global`).
excludes = ["tests/Support/lsp-stub.php", "tests/Support/slow-reading-lsp-server.php", "tests/Support/demanding-lsp-server.php", "tests/Support/incremental-lsp-server.php", "tests/Support/mock-lsp-server.php", "tests/Support/command-lsp-server.php", "tests/Support/mock-dap-adapter.php"]

# [linter.rules] — every rule runs (no disables). The size/complexity metric
# rules stay enabled but are calibrated to this TUI codebase's maxima: the
# composition root, the UAX#9 bidi tables and the render-heavy widgets
# legitimately exceed generic thresholds, so the rules guard against *future*
# regressions rather than the current deliberate structure.
#
# These numbers are a ratchet, not a ceiling picked once: after every
# structural round, every threshold is BISECTED to its floor (mago does not
# report measured values, so probing is the only way to read them) and set to
# the lowest clean value. Two different clean criteria, because the rules
# report at two severities: the error-level rules (cyclomatic, too-many-*,
# excessive-parameter-list, kan-defect) flip `composer lint`'s exit code, so
# their floor is "lowest threshold that still exits 0"; the halstead rule
# emits WARNINGS (exit stays 0 regardless), so its floor is "lowest threshold
# with zero halstead warnings in the output" — standing warning noise would
# train everyone to ignore the log. What sets each floor (re-bisected after
# the round-5 tree, July 2026 — for the first time EVERY pin is production
# code; the round-5 test split retired the E2e monolith that pinned two rules;
# all nine re-bisected again under mago 1.45, where exactly one moved):
#
#   cyclomatic-complexity   144  Input/MouseRouter — still on top. 143 until the
#                                editor gutter grew a fold column, which the
#                                router has to tell apart from the breakpoint
#                                columns beside it; extracting the branch into
#                                its own method does NOT move this, the rule
#                                sums the class. (Was 145 before git left
#                                `src/`; 220 two rounds before that, 133 before
#                                the graph viewer's click/drag-pan routing.)
#   too-many-methods         87  tests/…/MarkdownRendererTest — a TEST class
#                                again, and production code is nowhere near it.
#                                Bisected class by class: MarkdownRendererTest
#                                87, ResultsPanelWidgetTest 85,
#                                Editor/Document 80, Widget/CodeEditorWidget
#                                80 — down from 98 in two deliberate steps, and
#                                the point of both was to stop the widget being
#                                the pin at all.
#                                First the decoration sink: the widget used to
#                                IMPLEMENT EditorDecorationSink and forward all
#                                eight setters, so every new decoration was a
#                                method here. Then the view options, when soft
#                                wrap needed a toggle and would not fit: eleven
#                                forwarding methods became one display()
#                                accessor, and EditorViewOptions kept the one
#                                verb that is a real role rather than a
#                                delegation (setVcsGutter also drops the marks
#                                behind the strip).
#                                Both are the same move, and the rule to take
#                                from them: when this class blocks a feature,
#                                the answer is a seam, not a bigger number.
#                                (Was 208 when a test file last held the floor;
#                                106 until mago 1.45 recounted the same
#                                unchanged class as 97.)
#   too-many-properties      32  Widget/CodeEditorWidget (round 8's
#                                StylesDefault trait absorbed its $styles
#                                field; FindInFilesModal sits at 32 too after
#                                reabsorbing the round-5 VOs as plain fields)
#   too-many-enum-cases      59  Ui/Role (the theme role vocabulary; 58 until
#                                OccurrenceWriteBg joined it — a read and a write
#                                occurrence cannot share one role)
#   excessive-parameter-list 22  Bootstrap/WidgetHooks' constructor — near-
#                                unmoved since round 2 (splitting it was
#                                measured: it INCREASES coupling edges). Round
#                                26 dropped it 25 → 22: the pin had drifted
#                                above the real maximum, which is the exact
#                                failure mode this re-bisection exists to catch
#   kan-defect                8  plugins/git/src/Widget/DiffViewWidget and
#                                Overlay/State/FindInFilesModal (was 14, the
#                                E2e monolith). Unmoved by the git extraction
#                                because `plugins` is a linted path: the class
#                                changed address, not shape
#   halstead effort       21435  Help/MarkdownRenderer::render
#   halstead difficulty      30  Overlay/Presenter/WelcomeModalController::open
#   halstead volume        3236  tests/E2e/IdeTest::testFullScenario — one
#                                continuous scripted session, deliberately
#                                NOT split: its stages assert on state earlier
#                                stages created, and that continuity IS the
#                                coverage value
#
# The src pins are deliberate structure: WidgetHooks is a wiring step,
# MouseRouter's route() guard order is behaviour, and CodeEditorWidget /
# FindInFilesModal / DiffViewWidget carry measured-and-rejected extraction
# candidates (see docs/internals/decisions.md; DiffViewWidget's was measured in round
# 6 — 0/8 and 2/10 exclusive, worse than any prior rejection — so this
# sentence is no longer an assertion ahead of its evidence). None can drop
# without a decision that was considered and declined. Round 6 re-probed
# every threshold after its cleanups: no floor moved. Round 26 (the dock-tool
# seam, the TODO plugin, four smaller seams) re-probed all nine: only
# excessive-parameter-list moved, and downward — a stale pin, not a shrunk
# class. Round 27 (the document verb, the local-history plugin) re-probed all
# nine again: none moved. Round 28 (the menu-surface seam, plugin composer
# dependencies) re-bisected all nine once more — every floor is still exactly
# where it was, which is what a round that adds small classes should do. Round
# 29 (composer.json as the plugin manifest, then dependencies following the
# enabled state) re-bisected the six counting rules twice: unmoved both times.
# Round 30 (hooks became dispatched events) re-bisected again after deleting
# five *Callbacks DTOs and adding ~30 event classes: unmoved. Worth knowing
# WHY that keeps happening — every floor is pinned by one big class each
# (MouseRouter, CodeEditorWidget, Document…), and rounds that add small
# classes cannot move a maximum. Round 32 (the git plugin's interior: one git
# API where there were two, two process lanes where there were four, and fifty
# files grouped into eight directories) re-bisected all nine: none moved, which
# is what deleting a 104-line class and splitting a namespace should do — none
# of the nine is pinned by anything the round touched. Round 31 (git becomes a
# bundled plugin, ~5,700 lines out of `src/`) re-bisected all nine and moved
# exactly one:
# cyclomatic-complexity 145 → 143, because MouseRouter is one of the few pins a
# round CAN move — it lost two git-shaped branches to ViewPointers. The other
# eight are unmoved, and the git ones deliberately so: `plugins` is a linted
# path, so moving a class out of `src/` does not take it out of the gate.
# Round 33 (the settings screen: live plugin settings, the form's scroll and
# per-kind controls, reset, a caret in TextField, the search index) re-bisected
# all nine: none moved. Expected, and for the reason above — the round's one
# structurally heavy class, SettingsFormWidget, was EXTRACTED into five
# collaborators before any behaviour was added to it, precisely so it would not
# become a new pin. It is not one.
#
# Round 34 (semantic tokens, the LSP notifications Porta never listened to, the
# status bar's left-click cells) moved TWO — both MouseRouter, both upward, and
# both by one:
#   cyclomatic-complexity   144 -> 145. The status-bar click is one more branch
#                                in the left-press chain. Per the note above,
#                                extracting it does not help: the rule counts
#                                the CLASS, and the handler already lives in its
#                                own StatusBarClickRouter — only the two-line
#                                delegation is here.
#   excessive-parameter-list 22 -> 23. MouseRouter takes that router as its 23rd
#                                collaborator, overtaking WidgetHooks (22) as
#                                this rule's pin. Deliberately ONE argument: the
#                                click needs the hit-tester, the status bar, the
#                                command registry and the editor widget, and
#                                bundling them behind one router is what kept
#                                this at +1 instead of +4.
# Both floors verified by bisection, not assumed: at 144 and at 22 respectively,
# `composer lint` reports exactly one finding each.
#
# Re-bisect and lower again after the next structural change — AND after a mago
# upgrade, which can change how a metric is counted without a line of code
# moving (1.45 did exactly that to too-many-methods). A threshold far above the
# real maximum is not a gate. Verified failing: injecting 60 dummy
# properties into Ui/Notifier trips too-many-properties and lint exits 1.
[linter.rules]
cyclomatic-complexity = { threshold = 145 }
too-many-methods = { threshold = 87 }
too-many-properties = { threshold = 32 }
too-many-enum-cases = { threshold = 59 }
excessive-parameter-list = { threshold = 23 }
kan-defect = { threshold = 8 }
halstead = { effort-threshold = 21435, difficulty-threshold = 30, volume-threshold = 3236 }
