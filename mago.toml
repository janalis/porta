# Mago configuration — https://mago.carthage.software
#
# The formatter is tuned to the Symfony coding standard (the same conventions
# php-cs-fixer's @Symfony ruleset produces): single quotes, 4-space indent,
# next-line braces for classes/functions/methods, same-line braces for control
# structures and closures, no spaces around concatenation, a space after `fn`,
# `?Type` nullable hints, ordered imports and a blank line before `return`.
#
# php-cs-fixer never reflows code, so to match it the formatter is configured
# NOT to re-wrap: a wide print width plus "preserve breaking" keeps every line
# exactly where it is and only normalises spacing/braces/imports. One exception
# since 1.59: a concatenation or assignment the author already broke across
# lines is laid out whole, so a call chain inside it goes one call per line.
# (preserve-breaking-binary-expression makes it worse: 37 files moved, not 12.)
#
# mago ships no `symfony` formatter preset (1.59 offers default, psr-12, pint,
# tempest, hack and drupal), which is why the options below are spelled out.
#
# The linter follows the same standard (see [linter] and [linter.rules]):
# yoda comparisons (yoda_style), fully qualified native functions and constants
# (native_function_invocation / native_constant_invocation — ALL of them, not
# only @compiler_optimized, because mago cannot scope the rule to a list), and
# `$this->assert*()` in tests, which is how Symfony's own suites call PHPUnit.

php-version = "8.5"

[source]
# `plugins` is here for the same reason `src` is: a plugin ships code, and code
# this project ships is formatted, linted and analysed. It was outside every
# gate while a plugin file could only WIRE; now that a plugin may own classes,
# leaving it out would make plugins/ the place to put code you did not want
# graded.
paths = ["src", "tests", "plugins"]
# …but a VENDOR directory inside one of them is not code this project ships.
# Excluding it HERE, at the source level, drops it from the formatter, the
# linter and the analyzer at once — the per-tool excludes below cannot do that
# (and the formatter has no exclude list of its own, so a vendored file would
# be REWRITTEN by `composer format`).
#
# Literal paths only: `plugins/*/vendor`, `plugins/*/vendor/**`, `**/vendor`
# and `**/vendor/**` were each measured against a real vendored file and none
# matched. So a bundled plugin that vendors adds its own line here, and
# tests/Unit/Plugin/Runtime/BundledPluginVendorTest fails until it does.
#
# The entry below is the third-party-plugin fixture, which ships composer's
# generated maps VERBATIM — `array(…)`, no strict_types — because their exact
# shape is what it exists to prove we can read.
#
# The fixture home's plugin-install debris (`vendor/`, `plugins/{demo,cloned}`)
# used to be excluded here too. No test installs into it any more — a full
# verify leaves none — and the dangling symlinks it left made every mago run
# print "Failed to walk". If it comes back, a test is installing into the
# shared home: fix the test, do not re-add the exclude.
excludes = [
    "tests/Support/fixtures/thirdparty/acme-vendored/vendor",
    "tests/Support/fixtures/thirdparty/acme-malformed/vendor",
]
# Analyzed for type information but never reported on, so the analyzer knows the
# types of third-party classes (symfony/tui, PHPUnit, …) instead of treating
# everything from them as `mixed`.
includes = ["vendor"]

[analyzer]
# Static analysis targets production code. Tests drive widgets through dynamic,
# string-keyed lookups ($tui->getById('editor')->…) that a static analyzer cannot
# follow. (The quality gates themselves used to sit in tools/ and be excluded
# too; they are Symfony commands in src/Console/ now, analysed like everything
# else.)
#
# A plugin's tests are tests, so they are excluded too — one literal entry per
# plugin, because mago's excludes take paths and not globs (`plugins/*/tests`
# and `plugins/**/tests` were both tried and match nothing). A plugin that
# grows a tests/ directory adds its line here; forgetting shows up immediately
# as analyzer errors about test-only idioms.
#
# tests/Support is NOT excluded: the shared seams every test leans on are the
# test code most worth type-checking, and they carry none of the dynamic
# getById() idioms that justify excluding the suites. Its fixtures (broken
# on purpose) and the standalone mock-server scripts stay out.
excludes = ["tests/Unit", "tests/Integration", "tests/E2e", "tests/Support/fixtures", "tests/Support/slow-reading-lsp-server.php", "tests/Support/demanding-lsp-server.php", "tests/Support/incremental-lsp-server.php", "tests/Support/mock-lsp-server.php", "tests/Support/screenshot-lsp-server.php", "tests/Support/command-lsp-server.php", "tests/Support/mock-dap-adapter.php", "tests/Support/garbage-lsp-server.php", "tests/Support/chunked-lsp-server.php", "tests/Support/error-lsp-server.php", "tests/Support/lsp-stub.php", "tests/Support/logging-lsp-server.php", "tests/Support/labelled-lsp-server.php", "tests/Support/sigterm-immune-lsp-server.php", "tests/Support/flushing-lsp-server.php", "plugins/graph-viewer/tests", "plugins/image-viewer/tests", "plugins/todo/tests", "plugins/local-history/tests", "plugins/diff/tests", "plugins/git/tests", "plugins/symfony-lsp/tests", "plugins/review/tests", "plugins/mcp/tests", "plugins/assist/tests", "plugins/ssh/tests", "plugins/ftp/tests", "plugins/custos/tests"]

[formatter]
# Never re-wrap: keep the author's line breaks, like php-cs-fixer does.
print-width = 200
preserve-breaking-argument-list = true
preserve-breaking-parameter-list = true
preserve-breaking-conditional-expression = true
preserve-breaking-attribute-list = true
preserve-breaking-member-access-chain = true
# custos (SuspiciousBinaryOperation) asks for `a || (b && c)`: keep those parentheses,
# or the formatter strips what that gate requires.
preserve-redundant-logical-binary-expression-parentheses = true

# Symfony-specific overrides of Mago's defaults:
space-around-concatenation-binary-operator = false      # $a.$b, not $a . $b
space-before-arrow-function-parameter-list-parenthesis = true  # fn ($x), not fn($x)
empty-line-before-return = true                         # blank line before a non-leading return

# The remaining Symfony conventions are already Mago's defaults, kept explicit
# here as documentation:
single-quote = true
tab-width = 4
use-tabs = false
trailing-comma = true
null-type-hint = "question"                             # ?Type
control-brace-style = "same_line"                       # if (...) {
closure-brace-style = "same_line"
function-brace-style = "next_line"
method-brace-style = "next_line"
classlike-brace-style = "always_next_line"
sort-uses = true

[linter]
# `composer lint` is a required gate. The paths below are EXCLUDED
# deliberately — no rule is disabled; everything runs at full strength.
# The mock LSP/DAP servers are standalone procedural scripts, not codebase
# code — they keep their script idioms (camelCase helpers, `global`).
excludes = ["tests/Support/lsp-stub.php", "tests/Support/slow-reading-lsp-server.php", "tests/Support/demanding-lsp-server.php", "tests/Support/incremental-lsp-server.php", "tests/Support/mock-lsp-server.php", "tests/Support/screenshot-lsp-server.php", "tests/Support/command-lsp-server.php", "tests/Support/mock-dap-adapter.php"]
# The symfony integration reports nothing on this codebase today (no
# controllers, no bundles); it is on so that the day it would, it does. The
# phpunit integration is what brings assertion-style below.
integrations = ["symfony", "phpunit"]

# [linter.rules] — every rule runs (no disables). The size/complexity metric
# rules stay enabled but are calibrated to this TUI codebase's maxima: the
# composition root, the UAX#9 bidi tables and the render-heavy widgets
# legitimately exceed generic thresholds, so the rules guard against *future*
# regressions rather than the current deliberate structure.
#
# These numbers are a ratchet, not a ceiling picked once: after every
# structural round, every threshold is BISECTED to its floor (mago does not
# report measured values, so probing is the only way to read them) and set to
# the lowest clean value. Two different clean criteria, because the rules
# report at two severities: the error-level rules (cyclomatic, too-many-*,
# excessive-parameter-list, kan-defect) flip `composer lint`'s exit code, so
# their floor is "lowest threshold that still exits 0"; the halstead rule
# emits WARNINGS (exit stays 0 regardless), so its floor is "lowest threshold
# with zero halstead warnings in the output" — standing warning noise would
# train everyone to ignore the log. What sets each floor (re-bisected after
# the round-5 tree, July 2026 — for the first time EVERY pin is production
# code; the round-5 test split retired the E2e monolith that pinned two rules;
# all nine re-bisected again under mago 1.45, where exactly one moved, and
# under 1.59, where none did):
#
#   cyclomatic-complexity   143  Editor/Document alone (re-probed 2026-11-03,
#                                under 1.47 and 1.59 alike: Lsp/LspMapper 141,
#                                the graph viewer's GraphViewerWidget 139 —
#                                the code moved, not the metric). The two were tied
#                                on 2026-10-23, both measured and left alone in
#                                decisions.md — one state component each,
#                                complexity spread thin. MouseRouter, which
#                                held it until then, sits below; its history:
#                                147 → 145 in the Rector round below. It gained the
#                                file-tree drag: one entry in route()'s `||`
#                                chain and one `ctrl || shift` in the arm, +2.
#                                The drag ITSELF is Tree/TreeDragRouter, which
#                                is why it is only two. 144 before that; 143 until the
#                                editor gutter grew a fold column, which the
#                                router has to tell apart from the breakpoint
#                                columns beside it; extracting the branch into
#                                its own method does NOT move this, the rule
#                                sums the class. (Was 145 before git left
#                                `src/`; 220 two rounds before that, 133 before
#                                the graph viewer's click/drag-pan routing.)
#   too-many-methods         90  Widget/CodeEditorWidget alone (re-probed
#                                2026-11-03, under 1.47 and 1.59 alike:
#                                tests/…/SettingsFormWidgetTest, tied on
#                                2026-10-23, is at 89 since the phpcpd 9.2
#                                clone round shared its rigs).
#                                PluginApi held it at 94 until its sixteen
#                                buffered*() drains — public methods no plugin
#                                may call — moved onto PluginContributions; its
#                                raises before that, newest first: 94 for
#                                toolBinary(), the one
#                                resolution of a declared tool's binary that
#                                Settings shares — a plugin locating its own
#                                tool could not otherwise agree with the page
#                                that offers to install it. 93 before:
#                                scrollEditor(), so a
#                                wheel notch over a merge side scrolls the
#                                editor by screen rows as one over it does —
#                                jumpTo()'s $top is a LINE and cannot land
#                                inside a wrapped one. 92 before: softWrap()
#                                and editorScreen() (first editorRows()), so a
#                                diff wraps as the editor does and the merge
#                                view's sides stay level with its rows. Not
#                                one handle: the first is safe during
#                                activate() (the git view is built before the
#                                runtime is wired), the second an action
#                                method. 90 before:
#                                registerMarkdownFence() and
#                                its buffered drain add the Markdown rendering
#                                extension point requested by the Mermaid plan.
#                                88 before, 2026-10-03: openProject(),
#                                so the git plugin can switch worktree — the
#                                File › Open Project switch, guard and trust
#                                included. No handle fits one verb, and an
#                                emit()-able command event would open emit()
#                                to commands; raised by decision, not drift.
#                                87 before: participants()
#                                hands out ONE handle (PluginParticipants:
#                                set, outOfTouch, yourName) instead of three
#                                methods — the openBuffers() shape. 86 before:
#                                tests/…/ResultsPanelWidgetTest — a TEST
#                                class again, and production code is nowhere
#                                near it. Bisected class by class:
#                                ResultsPanelWidgetTest 85, Editor/Document
#                                80, Widget/CodeEditorWidget 80 — down from
#                                98 in two deliberate steps, and the point of
#                                both was to stop the widget being the pin at
#                                all. (Was 87 on MarkdownRendererTest until
#                                its table cases moved to MarkdownTableTest;
#                                the split lowered the floor and the pin
#                                followed it down. Re-probed under mago 1.47:
#                                the ONLY one of the nine that moved, and it
#                                moved because the code did, not the metric.)
#                                First the decoration sink: the widget used to
#                                IMPLEMENT EditorDecorationSink and forward all
#                                eight setters, so every new decoration was a
#                                method here. Then the view options, when soft
#                                wrap needed a toggle and would not fit: eleven
#                                forwarding methods became one display()
#                                accessor, and EditorViewOptions kept the one
#                                verb that is a real role rather than a
#                                delegation (setVcsGutter also drops the marks
#                                behind the strip).
#                                Both are the same move, and the rule to take
#                                from them: when this class blocks a feature,
#                                the answer is a seam, not a bigger number.
#                                (Was 208 when a test file last held the floor;
#                                106 until mago 1.45 recounted the same
#                                unchanged class as 97.)
#   too-many-properties      31  Widget/CodeEditorWidget alone (re-probed
#                                2026-10-23: FindInFilesModal has dropped
#                                below). Before: both at 30
#                                (round 8’s StylesDefault trait absorbed the
#                                editor’s $styles field; the modal reabsorbed
#                                the round-5 VOs as plain fields). This line
#                                read 32 against a pin of 31 for some time,
#                                with no correction note; re-probed
#                                2026-09-09, the pin is right and the prose
#                                was wrong — at 30 both classes fire.
#   too-many-enum-cases      78  Ui/Role (the theme role vocabulary; 58 until
#                                OccurrenceWriteBg joined it — a read and a write
#                                occurrence cannot share one role — and 60 with
#                                DebugValue: an inlay hint is what the code
#                                MEANS and is always there, a debug value is
#                                what it currently HOLDS and only while stopped.
#                                61 with DropTargetRow: a live drop target had
#                                been borrowing the hovered-directory tint, and
#                                the two were byte-identical, so "the files are
#                                going here" looked exactly like "the pointer is
#                                here". Monochrome is why it cannot be a merge
#                                of existing roles — there it has to be a mark
#                                distinct from both the hover's underline and
#                                the selection's reverse). 62 with the boxed
#                                text fields: FieldBorder + FieldPlaceholder
#                                replaced FieldFocusBg — a placeholder needs a
#                                mark of its own where Dim is plain (monochrome)
#                                or it passes for a typed value). Back to 61
#                                when DangerBg went: the armed settings button
#                                and the git discard confirm are double-bordered
#                                FieldState::Danger now — a tint that vanished
#                                in monochrome became a shape that does not.
#                                Still 61 with Rule, which took TagOffBg's
#                                slot: one tint for every separating line, and
#                                the diff toolbar's off tag went faint like the
#                                find tags. 65 with Agent1–4, 2026-09-30: agents
#                                at work are told apart by colour — caret, name
#                                and tab mark — and a colour is a role; four,
#                                a fifth agent sharing the first's. 69 with
#                                Agent5–8, 2026-10-01: a shared session takes
#                                eight guests, each a colour of its own; a
#                                ninth shares the first's). 71 with
#                                InlayParameter + InlayType, 2026-10-07: a hint
#                                drawn into the code is a shaded pill, as in
#                                PhpStorm, so it never reads as source; Inlay
#                                stays the plain grey of trailing annotations,
#                                which are not in the code, and a parameter's
#                                name and a type are told apart at a glance).
#                                76 with GutterBg and GutterError/Warning/
#                                Notice/Inlay, 2026-10-07: the gutter has a
#                                shade of its own, and a problem's line number
#                                is tinted by severity — colour only, no glyph
#                                — each a foreground AND a background a Diag
#                                role cannot carry). 78 with AddedRowBg and
#                                DeletedRowBg, 2026-10-20: GitHub's green and
#                                red bands behind a whole diff row, which the
#                                emphasis roles cannot be — they mark the
#                                changed span INSIDE a banded row, a step
#                                stronger, and the two must differ to read)
#   excessive-parameter-list 26  Plugin/Runtime/PluginRuntime, 2026-10-03: the
#                                ProjectSwitcher openProject() reaches, the
#                                same decision as too-many-methods above.
#                                25 before, 2026-10-01: the
#                                participant roster is the one live seam a
#                                plugin's people need, and it carries the
#                                user's own name too, so it is +1 and not +2.
#                                24 before: Input/MouseRouter' constructor,
#                                which took TreeDragRouter for the tree drag.
#                                23 before that.
#                                Bootstrap/WidgetHooks is 22 — near-
#                                unmoved since round 2 (splitting it was
#                                measured: it INCREASES coupling edges). Round
#                                26 dropped it 25 → 22: the pin had drifted
#                                above the real maximum, which is the exact
#                                failure mode this re-bisection exists to catch
#   kan-defect                8  nine classes at 8, re-probed 2026-10-23:
#                                GuestSession, HostSession, BufferService,
#                                RemoteFilesystem, LspSessionPool, PluginManager,
#                                FindBarWidget, MarkdownPageWidget and
#                                KeybindingsDocTest — measured and left alone in
#                                decisions.md (it counts a class's ifs and
#                                loops; at this size it is the class's size).
#                                DiffViewWidget and FindInFilesModal, which set
#                                it before, are below (was 14, the E2e monolith)
#   halstead effort       18673  Editor/BreadcrumbScanner's scanner (re-probed
#                                2026-10-23; EditorRowAssembler::assemble held
#                                it at 19275 before, and
#                                Help/MarkdownRenderer::render at 21435 until the
#                                preview round split its block dispatch,
#                                2026-09-30)
#   halstead difficulty      26  Markdown/Inline/InlineItem (re-probed
#                                2026-10-23; WelcomeModalController::open held
#                                it at 30 before)
#   halstead volume        3163  tests/E2e/IdeTest::testFullScenario — one
#                                continuous scripted session, deliberately
#                                NOT split: its stages assert on state earlier
#                                stages created, and that continuity IS the
#                                coverage value
#
# The src pins are deliberate structure: WidgetHooks is a wiring step,
# MouseRouter's route() guard order is behaviour, and CodeEditorWidget /
# FindInFilesModal / DiffViewWidget carry measured-and-rejected extraction
# candidates (see docs/internals/decisions.md; DiffViewWidget's was measured in round
# 6 — 0/8 and 2/10 exclusive, worse than any prior rejection — so this
# sentence is no longer an assertion ahead of its evidence). None can drop
# without a decision that was considered and declined. Round 6 re-probed
# every threshold after its cleanups: no floor moved. Round 26 (the dock-tool
# seam, the TODO plugin, four smaller seams) re-probed all nine: only
# excessive-parameter-list moved, and downward — a stale pin, not a shrunk
# class. Round 27 (the document verb, the local-history plugin) re-probed all
# nine again: none moved. Round 28 (the menu-surface seam, plugin composer
# dependencies) re-bisected all nine once more — every floor is still exactly
# where it was, which is what a round that adds small classes should do. Round
# 29 (composer.json as the plugin manifest, then dependencies following the
# enabled state) re-bisected the six counting rules twice: unmoved both times.
# Round 30 (hooks became dispatched events) re-bisected again after deleting
# five *Callbacks DTOs and adding ~30 event classes: unmoved. Worth knowing
# WHY that keeps happening — every floor is pinned by one big class each
# (MouseRouter, CodeEditorWidget, Document…), and rounds that add small
# classes cannot move a maximum. Round 32 (the git plugin's interior: one git
# API where there were two, two process lanes where there were four, and fifty
# files grouped into eight directories) re-bisected all nine: none moved, which
# is what deleting a 104-line class and splitting a namespace should do — none
# of the nine is pinned by anything the round touched. Round 31 (git becomes a
# bundled plugin, ~5,700 lines out of `src/`) re-bisected all nine and moved
# exactly one:
# cyclomatic-complexity 145 → 143, because MouseRouter is one of the few pins a
# round CAN move — it lost two git-shaped branches to ViewPointers. The other
# eight are unmoved, and the git ones deliberately so: `plugins` is a linted
# path, so moving a class out of `src/` does not take it out of the gate.
# Round 33 (the settings screen: live plugin settings, the form's scroll and
# per-kind controls, reset, a caret in TextField, the search index) re-bisected
# all nine: none moved. Expected, and for the reason above — the round's one
# structurally heavy class, SettingsFormWidget, was EXTRACTED into five
# collaborators before any behaviour was added to it, precisely so it would not
# become a new pin. It is not one.
#
# Round 34 (semantic tokens, the LSP notifications Porta never listened to, the
# status bar's left-click cells) moved TWO — both MouseRouter, both upward, and
# both by one:
#   cyclomatic-complexity   144 -> 145. The status-bar click is one more branch
#                                in the left-press chain. Per the note above,
#                                extracting it does not help: the rule counts
#                                the CLASS, and the handler already lives in its
#                                own StatusBarClickRouter — only the two-line
#                                delegation is here.
#   excessive-parameter-list 22 -> 23. MouseRouter takes that router as its 23rd
#                                collaborator, overtaking WidgetHooks (22) as
#                                this rule's pin. Deliberately ONE argument: the
#                                click needs the hit-tester, the status bar, the
#                                command registry and the editor widget, and
#                                bundling them behind one router is what kept
#                                this at +1 instead of +4.
# Both floors verified by bisection, not assumed: at 144 and at 22 respectively,
# `composer lint` reports exactly one finding each.
#
# The PHP 8.5 / Rector round (Symfony-style lint, then the PHP ≤8.5, type,
# code-quality, dead-code and PHPUnit sets) re-bisected all nine and moved ONE:
#   cyclomatic-complexity   147 -> 145. The pin had drifted: bisected on main
#                                before the round, the floor was already 146
#                                (at 145 MouseRouter fires). The round's own
#                                -1 is code-quality's if-return-bool collapse
#                                of the Welcome press, one `if` fewer in the
#                                class. The other eight hold their exact values,
#                                including IdeTest's volume — which is why
#                                Rector's (string)-cast assertion rule is
#                                skipped: it tipped that one.
#
# The custos MultipleReturnStatements round (435 methods funnelled to at most
# two returns, 2026-10-08) re-bisected all nine and moved FOUR:
#   cyclomatic-complexity   145 -> 143. MouseRouter fell to 141 (its press,
#                                wheel and drag arms became helpers), so the pin
#                                is Editor/Document, at its pre-round 143: its
#                                backspace and delete joins share one
#                                removeBetween(), so that it did not grow by two.
#   halstead effort/difficulty/volume  19275/30/3236 -> 18673/26/3163. Their pins had
#                                drifted before the round (bisected on the old
#                                tree, too, all three were already lower), and
#                                the round took MouseRouter off the effort list.
#                                Now set by Editor/BreadcrumbScanner,
#                                Markdown/Inline/InlineItem and IdeTest.
#   kan-defect stays 8, with eight classes on it (BufferService joined them).
#
# Re-bisect and lower again after the next structural change — AND after a mago
# upgrade, which can change how a metric is counted without a line of code
# moving (1.45 did exactly that to too-many-methods). A threshold far above the
# real maximum is not a gate. Verified failing: injecting 60 dummy
# properties into Ui/Notifier trips too-many-properties and lint exits 1.
[linter.rules]
cyclomatic-complexity = { threshold = 143 }
too-many-methods = { threshold = 90 }
too-many-properties = { threshold = 31 }
too-many-enum-cases = { threshold = 78 }
excessive-parameter-list = { threshold = 26 }
kan-defect = { threshold = 8 }
halstead = { effort-threshold = 18673, difficulty-threshold = 26, volume-threshold = 3163 }

# Symfony coding standard, linter half (see the header). These four are off or
# at `help` by default, and `help` never fails `--minimum-fail-level=note` —
# so each is raised to `warning` explicitly, or it would be advice, not a gate.
assertion-style = { style = "this" }
yoda-conditions = { enabled = true, level = "warning", mode = "require" }
ambiguous-function-call = { enabled = true, level = "warning" }
ambiguous-constant-access = { enabled = true, level = "warning" }
