# Mago configuration — https://mago.carthage.software
#
# The formatter is tuned to the Symfony coding standard (the same conventions
# php-cs-fixer's @Symfony ruleset produces): single quotes, 4-space indent,
# next-line braces for classes/functions/methods, same-line braces for control
# structures and closures, no spaces around concatenation, a space after `fn`,
# `?Type` nullable hints, ordered imports and a blank line before `return`.
#
# php-cs-fixer never reflows code, so to match it the formatter is configured
# NOT to re-wrap: a wide print width plus "preserve breaking" keeps every line
# exactly where it is and only normalises spacing/braces/imports.

php-version = "8.4"

[source]
# `plugins` is here for the same reason `src` is: a plugin ships code, and code
# this project ships is formatted, linted and analysed. It was outside every
# gate while a plugin file could only WIRE; now that a plugin may own classes,
# leaving it out would make plugins/ the place to put code you did not want
# graded.
paths = ["src", "tests", "plugins"]
# Analyzed for type information but never reported on, so the analyzer knows the
# types of third-party classes (symfony/tui, PHPUnit, …) instead of treating
# everything from them as `mixed`.
includes = ["vendor"]

[analyzer]
# Static analysis targets production code. Tests drive widgets through dynamic,
# string-keyed lookups ($tui->getById('editor')->…) that a static analyzer cannot
# follow. (The quality gates themselves used to sit in tools/ and be excluded
# too; they are Symfony commands in src/Console/ now, analysed like everything
# else.)
#
# A plugin's tests are tests, so they are excluded too — one literal entry per
# plugin, because mago's excludes take paths and not globs (`plugins/*/tests`
# and `plugins/**/tests` were both tried and match nothing). A plugin that
# grows a tests/ directory adds its line here; forgetting shows up immediately
# as analyzer errors about test-only idioms.
excludes = ["tests", "plugins/graph-viewer/tests", "plugins/image-viewer/tests"]

[formatter]
# Never re-wrap: keep the author's line breaks, like php-cs-fixer does.
print-width = 200
preserve-breaking-argument-list = true
preserve-breaking-parameter-list = true
preserve-breaking-conditional-expression = true
preserve-breaking-attribute-list = true
preserve-breaking-member-access-chain = true

# Symfony-specific overrides of Mago's defaults:
space-around-concatenation-binary-operator = false      # $a.$b, not $a . $b
space-before-arrow-function-parameter-list-parenthesis = true  # fn ($x), not fn($x)
empty-line-before-return = true                         # blank line before a non-leading return

# The remaining Symfony conventions are already Mago's defaults, kept explicit
# here as documentation:
single-quote = true
tab-width = 4
use-tabs = false
trailing-comma = true
null-type-hint = "question"                             # ?Type
control-brace-style = "same_line"                       # if (...) {
closure-brace-style = "same_line"
function-brace-style = "next_line"
method-brace-style = "next_line"
classlike-brace-style = "always_next_line"
sort-uses = true

[linter]
# `composer lint` is a required gate (see CLAUDE.md). The rules below are
# disabled deliberately; everything else runs at full strength on new code.
# The mock LSP/DAP servers are standalone procedural scripts, not codebase
# code — they keep their script idioms (camelCase helpers, `global`).
excludes = ["tests/Support/slow-reading-lsp-server.php", "tests/Support/demanding-lsp-server.php", "tests/Support/incremental-lsp-server.php", "tests/Support/mock-lsp-server.php", "tests/Support/command-lsp-server.php", "tests/Support/mock-dap-adapter.php"]

# [linter.rules] — every rule runs (no disables). The size/complexity metric
# rules stay enabled but are calibrated to this TUI codebase's maxima: the
# composition root, the UAX#9 bidi tables and the render-heavy widgets
# legitimately exceed generic thresholds, so the rules guard against *future*
# regressions rather than the current deliberate structure.
#
# These numbers are a ratchet, not a ceiling picked once: after every
# structural round, every threshold is BISECTED to its floor (mago does not
# report measured values, so probing is the only way to read them) and set to
# the lowest clean value. Two different clean criteria, because the rules
# report at two severities: the error-level rules (cyclomatic, too-many-*,
# excessive-parameter-list, kan-defect) flip `composer lint`'s exit code, so
# their floor is "lowest threshold that still exits 0"; the halstead rule
# emits WARNINGS (exit stays 0 regardless), so its floor is "lowest threshold
# with zero halstead warnings in the output" — standing warning noise would
# train everyone to ignore the log. What sets each floor (re-bisected after
# the round-5 tree, July 2026 — for the first time EVERY pin is production
# code; the round-5 test split retired the E2e monolith that pinned two rules;
# all nine re-bisected again under mago 1.45, where exactly one moved):
#
#   cyclomatic-complexity   145  Input/MouseRouter — back on top: round 5's
#                                handler map took FindInFilesModal below it
#                                (was 220 two rounds ago, 133 before the graph
#                                viewer's click/drag-pan routing landed)
#   too-many-methods         97  Widget/CodeEditorWidget (was 208, a test file;
#                                106 until mago 1.45, which counts the same
#                                unchanged class as 97 — a counting change, not
#                                a code change, and the only one of the nine
#                                floors the 1.43 → 1.45 upgrade moved)
#   too-many-properties      32  Widget/CodeEditorWidget (round 8's
#                                StylesDefault trait absorbed its $styles
#                                field; FindInFilesModal sits at 32 too after
#                                reabsorbing the round-5 VOs as plain fields)
#   too-many-enum-cases      58  Ui/Role (the theme role vocabulary)
#   excessive-parameter-list 25  Bootstrap/WidgetHooks' constructor — near-
#                                unmoved since round 2 (splitting it was
#                                measured: it INCREASES coupling edges; +1 for
#                                the graph viewer's handler wiring)
#   kan-defect                8  Widget/Git/DiffViewWidget and
#                                Overlay/State/FindInFilesModal (was 14, the
#                                E2e monolith)
#   halstead effort       21435  Help/MarkdownRenderer::render
#   halstead difficulty      30  Overlay/Presenter/WelcomeModalController::open
#   halstead volume        3236  tests/E2e/IdeTest::testFullScenario — one
#                                continuous scripted session, deliberately
#                                NOT split: its stages assert on state earlier
#                                stages created, and that continuity IS the
#                                coverage value
#
# The src pins are deliberate structure: WidgetHooks is a wiring step,
# MouseRouter's route() guard order is behaviour, and CodeEditorWidget /
# FindInFilesModal / DiffViewWidget carry measured-and-rejected extraction
# candidates (see CLAUDE.md; DiffViewWidget's was actually measured in round
# 6 — 0/8 and 2/10 exclusive, worse than any prior rejection — so this
# sentence is no longer an assertion ahead of its evidence). None can drop
# without a decision that was considered and declined. Round 6 re-probed
# every threshold after its cleanups: no floor moved.
#
# Re-bisect and lower again after the next structural change — AND after a mago
# upgrade, which can change how a metric is counted without a line of code
# moving (1.45 did exactly that to too-many-methods). A threshold far above the
# real maximum is not a gate. Verified failing: injecting 60 dummy
# properties into Ui/Notifier trips too-many-properties and lint exits 1.
[linter.rules]
cyclomatic-complexity = { threshold = 145 }
too-many-methods = { threshold = 97 }
too-many-properties = { threshold = 32 }
too-many-enum-cases = { threshold = 58 }
excessive-parameter-list = { threshold = 25 }
kan-defect = { threshold = 8 }
halstead = { effort-threshold = 21435, difficulty-threshold = 30, volume-threshold = 3236 }
