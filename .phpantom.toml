# ── tests/ and plugins/*/tests ─────────────────────────────────────────────
# A cluster rule is scoped to the test trees and selected by its message: it
# names one shape the triage read across many sites, never "anything in tests".
# Each is a shape that, under strict_types, would THROW if it ever were real —
# so it can hide no test passing by mistake. Anything that could pass silently
# (an extra argument, an unknown variable) is ruled per file instead, below.

# `Tui::getById()` is typed as the base AbstractWidget; the test knows the concrete widget behind the id (a wrong id fails loudly as an undefined method).
# phpantom 0.10.0; still reported on main (6fb245f).
[[diagnostics.ignore]]
identifier = "unknown_member"
path = "{tests/**,plugins/*/tests/**}"
message = "not found on class 'Symfony\\\\Component\\\\Tui\\\\Widget\\\\AbstractWidget'$"

