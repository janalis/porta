# phpantom (the PHP language server the phpantom plugin runs) — what it must
# not report on Porta's own files.
#
# Every rule below is a FALSE POSITIVE, read at its site and found correct:
# the code and its types are right and phpantom's flow analysis is not. None
# hides a real defect — the ones it found were fixed instead (an all-digit name
# keying an array as an int, in PluginOrder, local-history and assist).
#
# Narrow on purpose: an identifier, the exact message(s), and the files they
# were read in — never a whole tree. A NEW finding of any kind still shows.
# Each rule names the analyser gap; "fixed on main" means phpantom's unreleased
# main (6fb245f) no longer reports it, and the rule goes with the next release.
# `composer lsp` re-measures (docs/internals/contributing.md).

# ── src/ and plugins/*/src ──────────────────────────────────────────────────

