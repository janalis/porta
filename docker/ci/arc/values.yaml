# Uses the existing ARC controller; credentials stay in a Kubernetes secret.
githubConfigUrl: https://github.com/janalis/porta
githubConfigSecret: porta-runners-github-secret
# Pods share the developer machine. Each suite uses four workers.
maxRunners: 2
minRunners: 0
# Jobs run directly in their ephemeral runner pod; no Docker daemon is needed.
template:
  spec:
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:latest
        command: ["/home/runner/run.sh"]
