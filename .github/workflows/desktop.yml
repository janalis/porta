name: Desktop

# The native applications around Porta: each host's own tests, and the packages.
# Release calls this with a version; on a pull request it only proves they build.
on:
  push:
    branches: [feat/desktop-app]
  pull_request:
    paths:
      - 'desktop/**'
      - 'src/Desktop/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: 'The version the packages carry'
        type: string
        required: true
      ref:
        description: 'What to build'
        type: string
        required: true

permissions:
  contents: read

env:
  VERSION: ${{ inputs.version || '0.0.0' }}

jobs:
  phar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          extensions: mbstring, gd, pcntl, simplexml, ctype
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer build:phar
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-phar
          path: build/porta.phar

  php:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, os: macos-26 }
          - { name: macos-x86_64, os: macos-26-intel }
          - { name: linux-x86_64, os: ubuntu-24.04 }
          - { name: linux-aarch64, os: ubuntu-24.04-arm }
    name: static php (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      # A release always builds its PHP afresh, from sources checked against the lock.
      - id: cache
        if: ${{ !inputs.version }}
        uses: actions/cache@v4
        with:
          path: php-${{ matrix.name }}
          key: static-php-${{ matrix.name }}-${{ hashFiles('desktop/build-php.sh', 'desktop/verify-sources.sh', 'desktop/php-sources.lock', 'desktop/runtime/check-php.php') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        env:
          # static-php-cli asks GitHub where sources are; anonymously, it is rate limited.
          GITHUB_TOKEN: ${{ github.token }}
          PORTA_RELEASE: ${{ inputs.version }}
        run: desktop/build-php.sh "$PWD/php-${{ matrix.name }}"
      - run: ./php-${{ matrix.name }} -n desktop/runtime/check-php.php
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-php-${{ matrix.name }}
          path: php-${{ matrix.name }}

  macos:
    needs: [phar, php]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, os: macos-26 }
          - { name: macos-x86_64, os: macos-26-intel }
    name: macos (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - run: swift test
        working-directory: desktop/macos
      - uses: actions/download-artifact@v8
        with:
          name: desktop-phar
      - uses: actions/download-artifact@v8
        with:
          name: desktop-php-${{ matrix.name }}
      - name: The application
        env:
          PORTA_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            keychain="$RUNNER_TEMP/signing.keychain-db"
            security create-keychain -p ci "$keychain"
            security set-keychain-settings "$keychain"
            security unlock-keychain -p ci "$keychain"
            printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
            security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k ci "$keychain"
            security list-keychains -d user -s "$keychain" login.keychain-db
          fi
          desktop/macos/build-app.sh --php php-${{ matrix.name }} --phar porta.phar --version "$VERSION" --out dist
      - name: It runs
        run: |
          dist/Porta.app/Contents/Resources/runtime/porta-cli --version
          mkdir -p "$RUNNER_TEMP/shop"
          open -a "$PWD/dist/Porta.app" "$RUNNER_TEMP/shop"
          for _ in $(seq 1 60); do pgrep -f 'runtime/php' > /dev/null && break; sleep 0.5; done
          pgrep -f 'runtime/php' > /dev/null
          pkill -f 'Porta.app/Contents/MacOS/Porta'
      - name: The disk image
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          image="dist/porta-desktop-${{ matrix.name }}.dmg"
          # The runner's own Python takes no packages (PEP 668): dmgbuild gets a venv.
          python3 -m venv "$RUNNER_TEMP/dmgbuild"
          "$RUNNER_TEMP/dmgbuild/bin/pip" install --quiet dmgbuild==2.0.0
          echo "$RUNNER_TEMP/dmgbuild/bin" >> "$GITHUB_PATH"
          PATH="$RUNNER_TEMP/dmgbuild/bin:$PATH" desktop/macos/build-dmg.sh dist/Porta.app "$image"
          if [ -n "$APPLE_ID" ]; then
            xcrun notarytool submit "$image" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
            xcrun stapler staple "$image"
          fi
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          extensions: mbstring, pcntl, ctype
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: An installed application updates itself from the next disk image
        run: |
          desktop/macos/build-app.sh --php php-${{ matrix.name }} --phar porta.phar --version 99.0.0 --out next
          next_image="$RUNNER_TEMP/porta-desktop-${{ matrix.name }}.dmg"
          desktop/macos/build-dmg.sh next/Porta.app "$next_image"
          mkdir -p "$RUNNER_TEMP/Applications"
          ditto dist/Porta.app "$RUNNER_TEMP/Applications/Porta.app"
          php desktop/update-harness.php "$RUNNER_TEMP/Applications/Porta.app/Contents/Resources/runtime/porta.phar" "$next_image" v99.0.0
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$RUNNER_TEMP/Applications/Porta.app/Contents/Info.plist")" = 99.0.0
          codesign --verify --deep --strict "$RUNNER_TEMP/Applications/Porta.app"
          test "$(ls -A "$RUNNER_TEMP/Applications")" = Porta.app
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-package-${{ matrix.name }}
          path: dist/*.dmg

  linux:
    needs: [phar, php]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-24.04, nfpm: x86_64 }
          - { name: linux-aarch64, os: ubuntu-24.04-arm, nfpm: arm64 }
    name: linux (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      # The packages themselves, kept between runs: a slow mirror then costs nothing.
      - uses: actions/cache@v4
        with:
          path: ~/apt-archives
          key: apt-${{ matrix.name }}-${{ hashFiles('.github/workflows/desktop.yml') }}
          restore-keys: apt-${{ matrix.name }}-
      - run: |
          mkdir -p ~/apt-archives/partial
          echo "Dir::Cache::archives \"$HOME/apt-archives\";" | sudo tee /etc/apt/apt.conf.d/99porta-cache > /dev/null
      - run: |
          # The x86 runners' route to Ubuntu's archives has crawled at a few kB/s, for
          # half an hour, and security.ubuntu.com has answered 503: the kernel.org mirror,
          # served from a CDN, carries both pockets.
          sudo sed -i -E 's#https?://(([a-z0-9.-]+\.)?archive|security)\.ubuntu\.com/ubuntu/?#http://mirrors.edge.kernel.org/ubuntu/#' /etc/apt/sources.list.d/*.sources /etc/apt/sources.list 2>/dev/null || true
          # A stalled mirror has hung this step: bounded retries rather than the job's whole budget.
          for attempt in 1 2 3; do
            timeout 180 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update && break
            [ "$attempt" -lt 3 ] || exit 1
          done
          sudo apt-get install -y --no-install-recommends meson ninja-build libgtk-4-dev libvte-2.91-gtk4-dev libjson-glib-dev xvfb xdotool dbus weston
          # apt downloads as root; the cache is saved as the runner.
          sudo chown -R "$USER" ~/apt-archives
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v2.41.1/nfpm_2.41.1_Linux_${{ matrix.nfpm }}.tar.gz" | sudo tar -xz -C /usr/local/bin nfpm
      - run: |
          meson setup build desktop/linux
          meson test -C build --print-errorlogs
      - uses: actions/download-artifact@v8
        with:
          name: desktop-phar
      - uses: actions/download-artifact@v8
        with:
          name: desktop-php-${{ matrix.name }}
      - run: desktop/linux/package.sh --php php-${{ matrix.name }} --phar porta.phar --version "$VERSION" --out dist
      - name: It runs
        run: |
          mkdir unpacked
          tar -xzf dist/*.tar.gz -C unpacked
          dbus-run-session -- xvfb-run -a desktop/linux/smoke.sh "$PWD/unpacked/lib/porta-desktop"
      - name: It runs on Wayland
        run: dbus-run-session -- desktop/linux/smoke-session.sh wayland "$PWD/unpacked/lib/porta-desktop"
      - name: It offers its menus to a desktop that shows them
        run: dbus-run-session -- xvfb-run -a desktop/linux/smoke-session.sh menu "$PWD/unpacked/lib/porta-desktop"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          extensions: mbstring, pcntl, ctype
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: An installed tarball updates itself from the next one
        run: |
          installed="$RUNNER_TEMP/share/porta-desktop"
          mkdir -p "$installed"
          cp -R unpacked/lib/porta-desktop/. "$installed/"
          echo old > "$installed/runtime/porta.phar"
          php desktop/update-harness.php "$installed/runtime/porta.phar" dist/porta-desktop-linux-$(uname -m).tar.gz v99.0.0
          cmp porta.phar "$installed/runtime/porta.phar"
          test "$(ls -A "$RUNNER_TEMP/share")" = porta-desktop
      - name: An installed .deb updates itself through the package manager
        run: |
          sudo apt-get install -y "./dist/porta-desktop-linux-$(uname -m).deb"
          test "$(dpkg-query -W -f='${Version}' porta-desktop)" = "$VERSION"
          desktop/linux/package.sh --php php-${{ matrix.name }} --phar porta.phar --version 99.0.0 --out next
          # pkexec asks for a password through the desktop; here, sudo stands in for it.
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\nexec sudo "$@"\n' > "$RUNNER_TEMP/bin/pkexec"
          chmod 755 "$RUNNER_TEMP/bin/pkexec"
          PATH="$RUNNER_TEMP/bin:$PATH" php desktop/update-harness.php /usr/lib/porta-desktop/runtime/porta.phar "next/porta-desktop-linux-$(uname -m).deb" v99.0.0
          test "$(dpkg-query -W -f='${Version}' porta-desktop)" = 99.0.0
          test "$(cat /usr/lib/porta-desktop/runtime/desktop-package)" = "porta-desktop-linux-$(uname -m).deb"
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-next-${{ matrix.name }}
          path: next/*.rpm
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-package-${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm

  # Fedora: the .rpm installed with dnf, then updated from the next one by the
  # application's own update code, on the PHP and phar the package ships.
  rpm:
    needs: linux
    runs-on: ubuntu-24.04
    container: fedora:42
    timeout-minutes: 20
    steps:
      # Without git, checkout fetches the source archive, which leaves out desktop/ (export-ignore).
      - run: dnf install -y git
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/download-artifact@v8
        with:
          name: desktop-package-linux-x86_64
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: desktop-next-linux-x86_64
          path: next
      - name: An installed .rpm updates itself through dnf
        run: |
          dnf install -y ./dist/porta-desktop-linux-x86_64.rpm
          rpm -q --qf '%{VERSION}\n' porta-desktop
          # pkexec asks for a password through the desktop; in a container, root needs none.
          printf '#!/bin/sh\nexec "$@"\n' > /usr/local/bin/pkexec
          chmod 755 /usr/local/bin/pkexec
          PORTA_HARNESS_FROM_PHAR=1 /usr/lib/porta-desktop/runtime/php -n -d memory_limit=-1 desktop/update-harness.php /usr/lib/porta-desktop/runtime/porta.phar next/porta-desktop-linux-x86_64.rpm v99.0.0
          test "$(rpm -q --qf '%{VERSION}' porta-desktop)" = 99.0.0
          test "$(cat /usr/lib/porta-desktop/runtime/desktop-package)" = porta-desktop-linux-x86_64.rpm

  windows:
    needs: [phar, php]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - run: dotnet test desktop/windows/Tests --configuration Release
      - run: dotnet build desktop/windows/App --configuration Release
      - uses: actions/download-artifact@v8
        with:
          name: desktop-phar
          path: runtime
      - uses: actions/download-artifact@v8
        with:
          name: desktop-php-linux-x86_64
          path: runtime-php
      - uses: actions/download-artifact@v8
        with:
          name: desktop-php-linux-aarch64
          path: runtime-php
      - name: The runtime
        shell: bash
        run: |
          mkdir runtime/x86_64 runtime/aarch64
          mv runtime-php/php-linux-x86_64 runtime/x86_64/php
          mv runtime-php/php-linux-aarch64 runtime/aarch64/php
          cp desktop/runtime/porta-cli desktop/runtime/wsl-relay.php runtime/
          echo porta-desktop-windows.exe > runtime/desktop-package
      - name: The installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:VERSION" "/DSourceDir=$PWD\desktop\windows\App\bin\Release\net48" "/DRuntimeDir=$PWD\runtime" "/DOutputDir=$PWD\dist" desktop\windows\Installer\porta.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7.2.0
        with:
          distribution: Ubuntu-24.04
      - name: It runs inside WSL
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\shop" | Out-Null
          Set-Content "$env:RUNNER_TEMP\shop\composer.json" '{}'
          dotnet run --project desktop\windows\Smoke --configuration Release -- "$PWD\runtime" "$env:RUNNER_TEMP\shop"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: The installed application opens
        shell: pwsh
        run: |
          $installer = (Get-ChildItem dist\*.exe | Select-Object -First 1).FullName
          desktop\windows\Smoke\installed.ps1 -Installer $installer -Project "$env:RUNNER_TEMP\shop"
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-unsigned-windows
          path: dist/*.exe

  # The same installer on Windows on Arm: the x64 application under emulation,
  # running the arm64 PHP inside an arm64 distribution.
  windows-arm:
    needs: windows
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/download-artifact@v8
        with:
          name: desktop-unsigned-windows
          path: dist
      - name: The installed application opens
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\shop" | Out-Null
          Set-Content "$env:RUNNER_TEMP\shop\composer.json" '{}'
          $installer = (Get-ChildItem dist\*.exe | Select-Object -First 1).FullName
          desktop\windows\Smoke\installed.ps1 -Installer $installer -Project "$env:RUNNER_TEMP\shop"

  # Apart from the job above: the signing key never shares a runner with the
  # smoke tests or a third-party action.
  windows-sign:
    needs: windows
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: desktop-unsigned-windows
          path: dist
      - name: Sign, when there is a certificate
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) { Write-Output 'No certificate: the installer stays unsigned.'; exit 0 }
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\certificate.pfx", [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
          & $signtool sign /f "$env:RUNNER_TEMP\certificate.pfx" /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 (Get-ChildItem dist\*.exe).FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-package-windows
          path: dist/*.exe
