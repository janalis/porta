name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A red gate should be re-runnable after a flake fix without pushing a no-op.
  workflow_dispatch:
  # Advisories land against an unchanged lock too: without this, a new CVE
  # surfaces only when someone next opens a PR. Schedule runs execute the
  # audit job alone.
  schedule:
    - cron: '17 6 * * 1'

# Read-only token: every job only checks out and uploads an artifact.
permissions:
  contents: read

# A superseded push to the same PR cancels the run it obsoleted.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The extension list is pinned, not inherited from the runner image: gd, pcntl
# and simplexml are declared requirements that the image merely happens to
# bundle today. `intl` is deliberately NOT a requirement — the grapheme calls
# ride symfony/polyfill-intl-grapheme — so the test matrix grades both the
# native path and the polyfill every no-intl user actually runs.
env:
  PHP_EXTENSIONS: mbstring, gd, pcntl, simplexml, ctype
  # ARC pods share the developer machine; keep each suite to four workers.
  PORTA_TEST_PROCESSES: 4
  PORTA_SHARD_PROCESSES: 4
  # setup-php installs prerequisites on the minimal ARC runner image.
  runner: ${{ vars.CI_RUNNER && 'self-hosted' || 'github-hosted' }}

jobs:
  audit:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - name: Manifest check
        run: |
          composer validate --strict
          for manifest in plugins/*/composer.json; do
            composer validate --no-check-publish --no-check-lock "$manifest"
          done
      - name: Dependency audit
        run: composer audit --locked

  static:
    if: github.event_name != 'schedule'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          extensions: ${{ env.PHP_EXTENSIONS }}, intl
      - uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-
      - run: composer install --no-interaction --no-progress --classmap-authoritative
      - name: Format check
        run: composer format:check
      - name: Lint
        run: composer lint
      - name: Static analysis
        run: composer analyze
      - name: Rector
        run: composer rector:check
      - name: Architecture gate
        run: composer arch
      - name: Duplication gate
        run: composer duplication
      - name: Inspection gate
        run: composer custos

  tests:
    if: github.event_name != 'schedule'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: intl
            extensions: intl
          - name: polyfill (no intl)
            extensions: ':intl'
    name: tests (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          # setup-php installs php.ini-production, whose zend.assertions=-1 compiles
          # every assert() out: the invariants never ran here, and their lines
          # read as uncovered. It cannot be switched on at runtime, only here.
          ini-values: zend.assertions=1
          extensions: ${{ env.PHP_EXTENSIONS }}, ${{ matrix.extensions }}
      - uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-
      # The PHPUnit cache dir holds the result cache AND the shared test
      # container dump (tests/bootstrap.php pins PORTA_CACHE_DIR into it);
      # cold, every worker recompiles the container instead of sharing one.
      - uses: actions/cache@v6
        with:
          path: .phpunit.cache
          key: phpunit-${{ matrix.name }}-${{ github.run_id }}
          restore-keys: phpunit-${{ matrix.name }}-
      - run: composer install --no-interaction --no-progress --classmap-authoritative
      - name: Tests
        run: composer test

  # Two jobs, not one: the src pass and the plugin shards share no state and
  # produce separate reports, so the long pole is now the longer of the two
  # rather than their sum. `coverage:check` still chains both locally.
  coverage:
    if: github.event_name != 'schedule'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: pcov
          # setup-php installs php.ini-production, whose zend.assertions=-1 compiles
          # every assert() out: the invariants never ran here, and their lines
          # read as uncovered. It cannot be switched on at runtime, only here.
          ini-values: zend.assertions=1
          extensions: ${{ env.PHP_EXTENSIONS }}, intl
      - uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-
      - run: composer install --no-interaction --no-progress --classmap-authoritative
      # Kept as its own run beside `tests`, not instead of it — testing.md's
      # flake doctrine reads their divergence as the machine-load tell.
      - name: Coverage gate, src (100% lines)
        run: composer coverage:src
      - name: Coverage report artifact
        if: always()
        # A report, not a gate: a full artifact quota must not fail a green run.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: coverage-clover
          path: coverage/*.xml
          if-no-files-found: ignore
          retention-days: 14

  coverage-plugins:
    if: github.event_name != 'schedule'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: pcov
          # setup-php installs php.ini-production, whose zend.assertions=-1 compiles
          # every assert() out: the invariants never ran here, and their lines
          # read as uncovered. It cannot be switched on at runtime, only here.
          ini-values: zend.assertions=1
          extensions: ${{ env.PHP_EXTENSIONS }}, intl
      - uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-
      # This is the ONE pass that sets PORTA_CONTAINER_CACHE=on (it is serial
      # per shard, so tests/bootstrap.php lets it reuse the dump) — cold, it
      # pays a container compile per shard instead of reading one.
      - uses: actions/cache@v6
        with:
          path: .phpunit.cache
          key: phpunit-coverage-plugins-${{ github.run_id }}
          restore-keys: phpunit-coverage-plugins-
      - run: composer install --no-interaction --no-progress --classmap-authoritative
      # Each shard is its own serial phpunit run, so no merge happens inside
      # one — the property the serial pass existed for, kept while the shards
      # run several at a time.
      - name: Coverage gate, plugins (100% lines)
        run: composer coverage:plugins
      - name: Shard reports artifact
        if: always()
        # A report, not a gate: a full artifact quota must not fail a green run.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: coverage-plugins-clover
          path: coverage/plugins/*.xml
          if-no-files-found: ignore
          retention-days: 14

  release-package:
    if: github.event_name != 'schedule'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          extensions: ${{ env.PHP_EXTENSIONS }}
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Verify release packaging without publishing
        run: |
          composer build:phar
          test "$(php build/porta.phar --version)" = "porta $(git describe --tags --always --dirty)"
          sha256sum build/porta.phar
