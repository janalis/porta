name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded push to the same PR cancels the run it obsoleted.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: pcov
          extensions: mbstring, intl

      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - run: composer install --no-interaction --no-progress --classmap-authoritative

      - name: Manifest check
        run: |
          composer validate --strict
          for manifest in plugins/*/composer.json; do
            composer validate --no-check-publish --no-check-lock "$manifest"
          done

      - name: Dependency audit
        run: composer audit

      - name: Format check
        run: composer format:check

      - name: Lint
        run: composer lint

      - name: Static analysis
        run: composer analyze

      - name: Architecture gate
        run: composer arch

      - name: Tests
        run: composer test

      - name: Coverage gate (100% lines)
        run: composer coverage:check

      - name: Coverage report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-clover
          path: coverage/*.xml
          if-no-files-found: ignore
          retention-days: 14
