name: Docs

# Builds the documentation site (VitePress: .vitepress/ over docs/ and every
# plugin's docs/) and deploys it to GitHub Pages. Pull requests only build it:
# a dead link fails the build. The release workflow calls it after publishing,
# so the changelog and the version in the nav are current.
#
# The screenshots are drawn here, from the IDE as it is at this commit
# (`npm run docs:screenshots`, the E2e scenarios in tests/E2e/Screenshots),
# and never committed — so a change to the UI rebuilds the site.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'plugins/**'
      - 'src/**'
      - 'config/**'
      - 'composer.lock'
      - 'tests/E2e/Screenshots/**'
      - 'tests/Support/Screenshots/**'
      - 'CHANGELOG.md'
      - '.vitepress/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'plugins/*/docs/**'
      - 'CHANGELOG.md'
      - '.vitepress/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/E2e/Screenshots/**'
      - 'tests/Support/Screenshots/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to build (the release tag)'
        type: string
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # Tags for the version in the nav, history for "last updated".
          fetch-depth: 0
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          extensions: mbstring, gd, pcntl, simplexml, ctype, intl
      - uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-
      - run: composer install --no-interaction --no-progress
      # zsh for the terminal screenshot: sh, with no controlling tty, opens on
      # a job-control warning.
      - run: sudo apt-get install -y --no-install-recommends zsh
      - run: npm ci
      # A scenario that cannot reach its screen fails the build: a page would
      # otherwise show a missing image.
      - run: npm run docs:screenshots
      - run: npm run docs:build
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: .vitepress/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
