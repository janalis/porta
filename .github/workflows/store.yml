name: Store

# A pull request to store/plugins.json registers a plugin in Porta's plugin
# store (docs/plugin-store.md): bin/store-check makes sure every entry it adds
# or changes is its author's to make — the package on Packagist, published from
# a GitHub repository its author owns, and a takeover of a bundled plugin only
# by the owner of the tool that plugin drives.
on:
  pull_request:
    paths:
      - 'store/**'
      - '.github/workflows/store.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the registrations
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        # The base branch's check, never the pull request's own: a PR that
        # rewrote bin/store-check would otherwise approve itself.
        run: |
          git show "$BASE:bin/store-check" > "$RUNNER_TEMP/store-check"
          bash "$RUNNER_TEMP/store-check" "$BASE" "$AUTHOR"
